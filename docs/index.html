<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>III F Notice Board</title>
<meta name="theme-color" content="#232B3D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="III F Notices">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --bg: #F1F0E4;
    --surface: #FBFAF3;
    --surface-2: #E9E7D9;
    --border: #DBD8C5;
    --text: #232B3D;
    --text-muted: #5E6675;
    --text-faint: #8A8F7E;
    --brand: #2B3654;
    --brand-soft: #E4E3D3;
    --warn: #B8710F;
    --warn-ink: #7A4B0A;
    --warn-bg: #FBEACB;
    --warn-border: #E7C381;
    --done-bg: #E1E9DA;
    --done-border: #C1D2B7;
    --past-bg: #E9E7DA;
    --shadow: 0 1px 2px rgba(35,43,61,0.06), 0 4px 14px -6px rgba(35,43,61,0.16);
    --radius: 12px;

    --dot-dcu: #6C7A92;
    --dot-notes: #2B3654;
    --dot-exam: #B8710F;
    --dot-event: #93586B;
    --dot-holiday: #3E7A80;
    --dot-celeb: #A0762F;
    --dot-general: #8A8F7E;

    /* Exam-track subjects (also filed under Notes/Exams) get their own
       color; co-curricular subjects with no exam share --subj-neutral. */
    --subj-maths: #3E6B8A;      --subj-maths-bg: #E4ECF1;
    --subj-science: #3E7A55;    --subj-science-bg: #E3EFE6;
    --subj-english: #7A4B8A;    --subj-english-bg: #EEE4EF;
    --subj-hindi: #A6432E;      --subj-hindi-bg: #F3E1DB;
    --subj-marathi: #1F7A6B;    --subj-marathi-bg: #DFEEEA;
    --subj-sst: #8A6A1F;        --subj-sst-bg: #F1EAD8;
    --subj-cs: #4A5A8A;         --subj-cs-bg: #E4E6F1;
    --subj-evs: #5F8A3E;        --subj-evs-bg: #E7EFDE;
    --subj-robotics: #2F8A94;   --subj-robotics-bg: #DFEEF0;
    --subj-gk: #6B5F8A;         --subj-gk-bg: #E7E4EF;
    --subj-neutral: #6B6455;    --subj-neutral-bg: #E9E6D9;

    --today-bg: #FBEACB;
    --today-border: #E7C381;
    --today-ink: #7A4B0A;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171B24;
      --surface: #1E232E;
      --surface-2: #262C39;
      --border: #333A49;
      --text: #E9E7DC;
      --text-muted: #A3AAB8;
      --text-faint: #767E72;
      --brand: #A8B8E8;
      --brand-soft: #29304A;
      --warn: #E3A54B;
      --warn-ink: #F0C077;
      --warn-bg: #3A2E17;
      --warn-border: #5C471F;
      --done-bg: #212F22;
      --done-border: #34492F;
      --past-bg: #20242E;
      --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 6px 18px -8px rgba(0,0,0,0.5);
      --dot-dcu: #8B98AE;
      --dot-notes: #A8B8E8;
      --dot-exam: #E3A54B;
      --dot-event: #C48CA0;
      --dot-holiday: #6BB3B8;
      --dot-celeb: #D2A85E;
      --dot-general: #767E72;

      --subj-maths: #8FB4D6;      --subj-maths-bg: #26344A;
      --subj-science: #8FCBA3;    --subj-science-bg: #22392C;
      --subj-english: #C9A0D6;    --subj-english-bg: #382A42;
      --subj-hindi: #D97B62;      --subj-hindi-bg: #3B281F;
      --subj-marathi: #7FC9BC;    --subj-marathi-bg: #1F3A35;
      --subj-sst: #D6BE7F;        --subj-sst-bg: #3A331D;
      --subj-cs: #A3ADD6;         --subj-cs-bg: #2A2E42;
      --subj-evs: #A6D68F;        --subj-evs-bg: #2C3A22;
      --subj-robotics: #83CBD3;   --subj-robotics-bg: #1E3739;
      --subj-gk: #B3A6D6;         --subj-gk-bg: #2E293C;
      --subj-neutral: #ABA592;    --subj-neutral-bg: #2C2A22;

      --today-bg: #3A2E17;
      --today-border: #5C471F;
      --today-ink: #F0C077;
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: env(safe-area-inset-bottom);
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  .wrap { max-width: 640px; margin: 0 auto; padding: 0 14px 32px; }

  /* ---- Masthead ---- */
  .masthead {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: calc(10px + env(safe-area-inset-top)) 0 12px;
    border-bottom: 2px solid var(--brand);
    margin-bottom: 4px;
  }
  .masthead .eyebrow {
    font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--brand); font-weight: 700; flex-shrink: 0;
  }
  .subscribe-btn {
    display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0;
    font-size: 12.5px; font-weight: 600; color: var(--brand);
    background: var(--brand-soft); border: 1px solid var(--border);
    border-radius: 6px; padding: 7px 12px; text-decoration: none;
  }
  .subscribe-btn svg { width: 12px; height: 12px; flex-shrink: 0; }

  /* ---- Tab bar ---- */
  .tabbar {
    position: sticky; top: 0; z-index: 5;
    display: flex; gap: 4px; background: var(--bg);
    padding: 10px 0; margin-bottom: 4px;
    border-bottom: 1px solid var(--border);
  }
  .tab-btn {
    flex: 1; font-size: 13.5px; font-weight: 600; color: var(--text-muted);
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px;
    padding: 9px 4px; text-align: center;
  }
  .tab-btn.active { background: var(--brand); color: var(--bg); border-color: var(--brand); }
  .tab-panel { display: none; padding-top: 10px; }
  .tab-panel.active { display: block; }

  .section-note { font-size: 12px; color: var(--text-faint); margin: 2px 0 12px; }
  .empty-state { font-size: 13px; color: var(--text-faint); font-style: italic; padding: 14px 2px; }

  /* ---- This-week strip: holiday-list/events-calendar entries with no
     notice of their own, capped to a 7-day lookahead so the yearly master
     lists don't flood Upcoming with a card per holiday/event. ---- */
  .week-strip { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .week-strip:empty { display: none; margin: 0; }
  .week-strip-head {
    font-size: 11px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase;
    color: var(--text-faint); margin-bottom: 2px;
  }
  .week-row {
    display: flex; align-items: center; gap: 9px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 11px; font-size: 12.5px;
  }
  .week-row.is-today { background: var(--today-bg); border-color: var(--today-border); }
  .week-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .week-when { flex-shrink: 0; font-weight: 700; color: var(--text-muted); min-width: 60px; }
  .week-row.is-today .week-when { color: var(--today-ink); }
  .week-name { flex: 1; color: var(--text); }

  /* ---- Upcoming cards ---- */
  .action-list { display: flex; flex-direction: column; gap: 8px; }
  .action-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 11px 13px; border-left: 4px solid var(--text-faint);
  }
  .action-card.state-today { border-left-color: var(--warn); background: var(--warn-bg); }
  .action-card.state-soon { border-left-color: var(--warn); }
  .action-card.state-past { border-left-color: var(--text-faint); background: var(--past-bg); opacity: 0.75; }
  .action-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; cursor: pointer; }
  .action-top-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .action-chevron { color: var(--text-faint); font-size: 11px; transition: transform .15s; }
  .action-card.open .action-chevron { transform: rotate(90deg); }
  .action-full {
    display: none; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border);
    font-size: 13.5px; white-space: pre-line;
  }
  .action-card.open .action-full { display: block; }
  .action-kind { font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-faint); font-weight: 700; }
  .action-title { font-weight: 700; font-size: 15px; margin: 2px 0 3px; }
  .action-meta { font-size: 12.5px; color: var(--text-muted); }
  .action-badge {
    flex-shrink: 0; font-size: 10.5px; font-weight: 700; padding: 3px 8px;
    border-radius: 6px; white-space: nowrap;
  }
  .badge-today { background: var(--warn); color: #1E1608; }
  .badge-soon { background: var(--warn-bg); color: var(--warn-ink); border: 1px solid var(--warn-border); }
  .badge-past { background: transparent; color: var(--text-faint); border: 1px solid var(--border); }
  .action-date { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  /* Attachments (link or inline image) only show once a card is expanded
     -- a collapsed Upcoming card is a scannable summary, not a photo feed. */
  .action-attach, .action-attach-image { display: none; }
  .action-card.open .action-attach {
    display: inline-block; margin-top: 8px; font-size: 12.5px; color: var(--brand);
    font-weight: 700; text-decoration: none; padding: 4px 0;
  }
  .action-card.open .action-attach-image {
    display: block; max-width: 100%; height: auto; border-radius: 8px; margin-top: 8px; border: 1px solid var(--border);
  }
  .action-materials {
    display: none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); white-space: normal;
  }
  .action-card.open .action-materials { display: block; }
  .action-materials-head {
    font-size: 11px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; color: var(--text-faint);
    margin-bottom: 8px;
  }

  /* ---- HW / todo ---- */
  .hw-list { display: flex; flex-direction: column; gap: 8px; }
  .hw-row {
    display: flex; align-items: flex-start; gap: 10px; cursor: pointer;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 11px 13px;
  }
  .hw-check { flex-shrink: 0; width: 24px; height: 24px; color: var(--text-faint); margin-top: 1px; }
  .hw-check svg { width: 100%; height: 100%; }
  .hw-row.is-done .hw-check { color: var(--brand); }
  .hw-body { flex: 1; min-width: 0; }
  .hw-top { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; flex-wrap: wrap; }
  .hw-text { font-size: 13.5px; color: var(--text); line-height: 1.4; }
  .hw-row.is-done { opacity: 0.55; }
  .hw-row.is-done .hw-text { text-decoration: line-through; }

  /* ---- Filter chips ---- */
  .chip-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 8px; -webkit-overflow-scrolling: touch; }
  .chip-row::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0; font-size: 12.5px; font-weight: 600; color: var(--text-muted);
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 12px; white-space: nowrap;
  }
  .chip.active { background: var(--brand); color: var(--bg); border-color: var(--brand); }

  /* ---- Feed ---- */
  .feed-day-head {
    font-size: 12px; font-weight: 700; color: var(--brand); margin: 14px 0 6px;
    display: flex; align-items: center; gap: 7px;
  }
  .feed-day-head.is-today {
    color: var(--today-ink); background: var(--today-bg); border: 1px solid var(--today-border);
    padding: 3px 8px; margin-left: -8px;
  }
  .feed-day-head .today-tag {
    font-size: 9.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    background: var(--today-ink); color: var(--today-bg); padding: 1px 5px;
  }
  .feed-item {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 7px;
  }
  .feed-item.is-today-timetable {
    border-color: var(--today-border); background: var(--today-bg);
  }
  .feed-item-row { display: flex; align-items: center; gap: 8px; }
  .feed-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .feed-title { font-weight: 700; font-size: 13.5px; }
  .feed-preview {
    color: var(--text-muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; flex: 1; min-width: 0;
  }
  .feed-chevron { color: var(--text-faint); font-size: 11px; flex-shrink: 0; transition: transform .15s; }
  .feed-item.open .feed-chevron { transform: rotate(90deg); }
  .feed-full {
    display: none; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border);
    font-size: 13.5px; white-space: pre-line;
  }
  .feed-item.open .feed-full { display: block; }
  .feed-item.open .feed-preview { display: none; }
  .feed-attach { display: inline-block; margin-top: 9px; font-size: 12.5px; color: var(--brand); font-weight: 700; text-decoration: none; }
  .feed-attach-image {
    display: block; max-width: 100%; height: auto; border-radius: 8px; margin-top: 9px; border: 1px solid var(--border);
  }

  .period-list { display: flex; flex-direction: column; gap: 9px; }
  .period-row { display: flex; gap: 9px; align-items: flex-start; }
  .period-num {
    flex-shrink: 0; font-size: 10.5px; font-weight: 700; color: var(--text-faint);
    background: var(--surface-2); border-radius: 6px; padding: 2px 6px; margin-top: 1px;
  }
  .period-body { font-size: 13.5px; line-height: 1.45; }
  .subject-badge {
    display: inline-flex; align-items: center; font-size: 10.5px; font-weight: 700;
    letter-spacing: 0.02em; padding: 2px 6px; margin-right: 6px; border-radius: 6px;
    vertical-align: 1px; white-space: nowrap;
  }
  .subject-badge.is-neutral {
    background: var(--subj-neutral-bg); color: var(--subj-neutral);
  }
  .period-hw {
    margin-top: 5px; font-size: 12.5px; color: var(--warn-ink);
    background: var(--warn-bg); border-left: 3px solid var(--warn);
    padding: 4px 8px; border-radius: 0 6px 6px 0;
  }
  .period-hw-tag {
    font-size: 9.5px; font-weight: 700; letter-spacing: 0.03em; background: var(--warn);
    color: #1E1608; border-radius: 6px; padding: 1px 5px; margin-right: 5px;
  }

  /* ---- Notes library ---- */
  .subject-grid { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
  .subject-chip {
    font-size: 13px; font-weight: 600; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 6px; padding: 9px 13px;
  }
  .subject-chip.active { background: var(--brand); color: var(--bg); border-color: var(--brand); }
  .material-head {
    display: flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 700;
    letter-spacing: 0.03em; text-transform: uppercase; color: var(--text-faint);
    margin: 16px 0 8px;
  }
  .material-head:first-child { margin-top: 0; }
  .material-count {
    font-size: 10px; font-weight: 700; color: var(--text-muted); background: var(--surface-2);
    border-radius: 6px; padding: 1px 7px;
  }
  /* Notes tab groups by exam cycle first (Half Yearly/PT-1), material type
     second within each -- cycle-head is the primary heading, material-type-head
     the secondary one nested under it. */
  .cycle-head {
    font-size: 12px; font-weight: 700; color: var(--brand); margin: 14px 0 6px 2px;
  }
  .material-type-head {
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase;
    color: var(--text-faint); margin: 10px 0 5px 4px; display: flex; align-items: center; gap: 7px;
  }
  .cycle-head + .material-type-head { margin-top: 0; }

  /* ---- Exam prep ---- */
  .exam-portion-card {
    background: var(--warn-bg); border: 1px solid var(--warn-border); border-left: 4px solid var(--warn);
    border-radius: 6px 10px 10px 6px; padding: 12px 14px; margin-bottom: 16px;
  }
  .exam-portion-label {
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--warn-ink);
  }
  .exam-portion-title { font-weight: 700; font-size: 14.5px; margin: 3px 0 4px; color: var(--text); }
  .exam-portion-meta { font-size: 12px; color: var(--warn-ink); opacity: 0.85; margin-bottom: 9px; }
  .exam-portion-link { font-size: 12.5px; font-weight: 700; color: var(--brand); text-decoration: none; }
  .portion-row-text {
    font-size: 13px; color: var(--text); line-height: 1.5; white-space: pre-line; margin-bottom: 10px;
  }
  .portion-notes { margin: 8px 0 18px; }
  .portion-notes ul { margin: 0; padding-left: 18px; font-size: 12px; color: var(--text-muted); }
  .portion-notes li { margin-bottom: 4px; }
  /* A multi-day stretch between two consecutive tests -- a holiday when one
     matches, otherwise just a plain gap -- called out as prep buffer time
     instead of leaving parents to notice the jump themselves. */
  .exam-gap-row {
    display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-faint);
    font-style: italic; padding: 2px 4px 10px;
  }
  .exam-gap-row::before { content: "⋯"; font-style: normal; }

  /* One card per group -- notes, worksheets and revision listed together
     (tagged, not split into separate headed sections) wherever they
     appear: one card per subject in the Exam tab, one card per exam cycle
     in the Notes tab. */
  .material-group-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 13px 14px; margin-bottom: 12px;
  }
  .exam-subject-head {
    display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; color: var(--text);
    margin-bottom: 11px; flex-wrap: wrap;
  }
  .exam-subject-head .material-count { margin-left: auto; }
  .exam-subject-head-right {
    margin-left: auto; display: flex; align-items: center; gap: 8px; font-weight: 600;
  }
  .portion-schedule-date { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
  .exam-schedule-marks { font-size: 11px; color: var(--text-faint); white-space: nowrap; }
  .exam-material-row {
    display: flex; align-items: center; gap: 10px;
    padding-top: 10px; border-top: 1px dashed var(--border);
  }
  .exam-material-row:first-child { padding-top: 0; border-top: none; }
  a.exam-material-row-link { text-decoration: none; color: inherit; }
  .exam-material-body { flex: 1; min-width: 0; }
  .exam-material-top { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; }
  .exam-material-tag {
    flex-shrink: 0; font-size: 9.5px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase;
    background: var(--surface-2); color: var(--text-faint); border-radius: 4px; padding: 1px 6px;
  }
  .exam-material-tag.tag-worksheet { background: var(--brand-soft); color: var(--brand); }
  .exam-material-tag.tag-revision { background: var(--warn-bg); color: var(--warn-ink); }
  .exam-material-tag.tag-answerkey { background: var(--subj-neutral-bg); color: var(--subj-neutral); }
  .exam-material-title { font-weight: 700; font-size: 13.5px; }
  .exam-material-meta { margin-top: 3px; }
  .exam-material-date { font-size: 11.5px; color: var(--text-faint); }

  a { color: var(--brand); }
  select, input {
    font-size: 16px; /* prevents iOS auto-zoom on focus */
    font-family: inherit;
  }

  footer.note {
    margin-top: 26px; padding-top: 12px; border-top: 1px solid var(--border);
    font-size: 10.5px; color: var(--text-faint);
  }
  .footer-credit { margin-top: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div class="eyebrow">Class III F</div>
    <a class="subscribe-btn" href="https://calendar.google.com/calendar/u/0?cid=YzAzN2Y0ZDc0ODkyZjU1N2VkNzQwYjFkMjQxMGU2YmIxZWZjYWIyMjRkZGQ5NWFkNDVkMWU0ODZiYzhhODVlNUBncm91cC5jYWxlbmRhci5nb29nbGUuY29t" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Subscribe on Calendar
    </a>
  </div>

  <div class="tabbar">
    <button class="tab-btn active" data-tab="upcoming">Upcoming</button>
    <button class="tab-btn" data-tab="hw">HW</button>
    <button class="tab-btn" data-tab="exam">Exam</button>
    <button class="tab-btn" data-tab="notes">Notes</button>
    <button class="tab-btn" data-tab="feed">Feed</button>
  </div>

  <div class="tab-panel active" id="panel-upcoming">
    <div class="section-note">Exams, school events &amp; holidays, newest first</div>
    <div class="week-strip" id="weekStrip"></div>
    <div class="action-list" id="actionList"></div>
  </div>

  <div class="tab-panel" id="panel-hw">
    <div class="section-note">Homework from the last two weeks — tap to mark done</div>
    <div id="hwList"></div>
  </div>

  <div class="tab-panel" id="panel-exam">
    <div class="section-note">Everything for one exam — schedule, portion &amp; notes — in one place</div>
    <div class="subject-grid" id="examCycleGrid"></div>
    <div id="examDetail"></div>
  </div>

  <div class="tab-panel" id="panel-notes">
    <div class="section-note">Select a subject to see all notes, chapter-wise</div>
    <div class="subject-grid" id="subjectGrid"></div>
    <div id="chapterList"></div>
  </div>

  <div class="tab-panel" id="panel-feed">
    <div class="chip-row" id="categoryChips"></div>
    <div class="chip-row" id="subjectChips"></div>
    <div id="feedList"></div>
  </div>

  <footer class="note">
    <div id="footerNote">Loading…</div>
    <div class="footer-credit">Made with ❤️ by Dharmesh</div>
  </footer>
</div>

<script>
const CATEGORY_META = {
  "Exam/Test":          { dot: "var(--dot-exam)",    label: "Exam/Test" },
  "School Event":       { dot: "var(--dot-event)",   label: "School Event" },
  "Holiday":            { dot: "var(--dot-holiday)", label: "Holiday" },
  "Subject Notes":      { dot: "var(--dot-notes)",   label: "Subject Notes" },
  "Daily Class Update": { dot: "var(--dot-dcu)",     label: "Daily Update" },
  "Event/Celebration":  { dot: "var(--dot-celeb)",   label: "Celebration" },
  "General/Other":      { dot: "var(--dot-general)", label: "General" },
};
const UPCOMING_CATEGORIES = ["Exam/Test", "School Event", "Holiday"];
// Exam/Test and Subject Notes have their own dedicated tabs (Exam, Notes)
// with much better treatment (portion table, grouped-by-cycle materials)
// -- showing them in Feed too is just noise duplicating those tabs.
const FEED_CATEGORIES = Object.keys(CATEGORY_META).filter(c => c !== "Exam/Test" && c !== "Subject Notes");

// Exam-track subjects get their own color + short form; anything else
// (co-curricular, no exam) falls back to one shared neutral badge below.
const SUBJECT_META = {
  "Maths":            { abbr: "MATH", bg: "var(--subj-maths-bg)",    fg: "var(--subj-maths)" },
  "Science":          { abbr: "SCI",  bg: "var(--subj-science-bg)",  fg: "var(--subj-science)" },
  "English":          { abbr: "ENG",  bg: "var(--subj-english-bg)",  fg: "var(--subj-english)" },
  "Hindi":            { abbr: "HIN",  bg: "var(--subj-hindi-bg)",    fg: "var(--subj-hindi)" },
  "Marathi":          { abbr: "MAR",  bg: "var(--subj-marathi-bg)",  fg: "var(--subj-marathi)" },
  "Social Studies":   { abbr: "SST",  bg: "var(--subj-sst-bg)",      fg: "var(--subj-sst)" },
  "Computer Science": { abbr: "CS",   bg: "var(--subj-cs-bg)",       fg: "var(--subj-cs)" },
  "EVS":              { abbr: "EVS",  bg: "var(--subj-evs-bg)",      fg: "var(--subj-evs)" },
  "Robotics":         { abbr: "ROB",  bg: "var(--subj-robotics-bg)", fg: "var(--subj-robotics)" },
  "GK":               { abbr: "GK",   bg: "var(--subj-gk-bg)",       fg: "var(--subj-gk)" },
};
// Co-curricular subjects (no exam) -- colored badge would be 20+ near-
// indistinguishable hues, so they share one neutral style and just vary
// by abbreviation.
const NEUTRAL_SUBJECT_ABBR = {
  "Art & Craft": "A&C", "Assembly": "ASM", "Dance": "DNC", "Leadership": "LDR",
  "Life Skills": "LS", "Martial Arts": "MA", "Music": "MUS",
  "Reading Program": "RP", "Skating": "SKT", "Speech & Drama": "S&D", "Sports": "SPT",
};
function subjectAbbr(subject) {
  const meta = SUBJECT_META[subject];
  return meta ? meta.abbr : (NEUTRAL_SUBJECT_ABBR[subject] || subject.slice(0, 4).toUpperCase());
}
function subjectBadge(subject) {
  const meta = SUBJECT_META[subject];
  if (meta) return `<span class="subject-badge" style="background:${meta.bg};color:${meta.fg}" title="${escapeHtml(subject)}">${meta.abbr}</span>`;
  return `<span class="subject-badge is-neutral" title="${escapeHtml(subject)}">${subjectAbbr(subject)}</span>`;
}
// Same color used for the badge doubles as the button's color when it's
// used as a filter chip -- solid fill (color as background) when selected,
// soft tint when not, so the active subject still reads clearly.
function subjectChipHtml(subject, isActive, cls) {
  const meta = SUBJECT_META[subject];
  const bg = meta ? meta.bg : "var(--subj-neutral-bg)";
  const fg = meta ? meta.fg : "var(--subj-neutral)";
  const style = isActive
    ? `background:${fg};color:var(--surface);border-color:${fg}`
    : `background:${bg};color:${fg};border-color:transparent`;
  return `<button class="${cls}${isActive ? " active" : ""}" data-subj="${escapeHtml(subject)}" style="${style}" title="${escapeHtml(subject)}">${subjectAbbr(subject)}</button>`;
}

function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function parseDMY(d) {
  const [dd, mm, yyyy] = d.split("-").map(Number);
  return new Date(yyyy, mm - 1, dd);
}
function parseISO(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function fmtDate(d) {
  return d.toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short" });
}
function daysUntil(d) {
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(d); target.setHours(0,0,0,0);
  return Math.round((target - today) / 86400000);
}
const GREETING_RE = /^dear (parents?|parent)s?,?$/i;
function firstLine(text) {
  const lines = text.split("\n").map(s => s.trim()).filter(Boolean);
  return lines.find(l => !GREETING_RE.test(l)) || lines[0] || text;
}
function noticeTitle(r) {
  if (r.subject && r.chapter) return `${r.subject} — ${r.chapter}`;
  if (r.subject) return r.subject;
  if (r.is_timetable) return `Timetable — ${fmtDate(parseISO(r.event_date_iso))}`;
  if (r.category === "Daily Class Update") return "Daily Class Update";
  return firstLine(r.text);
}
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
// A photo attachment (a seek-kit materials list, a Facebook-recap photo) is
// more useful shown inline than as a bare "View attachment" link -- a PDF
// (worksheet, portion sheet) still needs the link since it can't render
// inline anyway.
const IMAGE_ATTACHMENT_RE = /\.(jpe?g|png|gif|webp)$/i;
function attachmentHtml(url, imgClass, linkClass, label) {
  if (!url) return "";
  if (IMAGE_ATTACHMENT_RE.test(url)) {
    return `<a href="${url}" target="_blank" rel="noopener"><img class="${imgClass}" src="${url}" loading="lazy" alt=""></a>`;
  }
  return `<a class="${linkClass}" href="${url}" target="_blank" rel="noopener">${label}</a>`;
}

let ALL = [];
// Hand-transcribed from each exam's portion-sheet attachment (a scanned
// table, not extractable from notice text) -- see docs/portion_schedules.json.
let PORTION_SCHEDULES = {};
// Parsed from the once-a-year Holiday List / Special Days & Events master
// documents (docs/holidays.json, docs/events_calendar.json) -- see
// attachments/master_docs.py. Most of these never get an individual
// notice of their own, so without this they'd never surface until
// someone happened to scroll to that date in Feed.
let HOLIDAYS = { holidays: [], vacations: [] };
let EVENTS_CALENDAR = { events: [], ptm: [], exam_windows: [] };

// Every named exam cycle, most recently active first.
function sortedExamCycles() {
  const cycles = [...new Set(ALL.map(r => r.exam_cycle).filter(Boolean))];
  cycles.sort((a, b) => {
    const latest = c => Math.max(...ALL.filter(r => r.exam_cycle === c).map(r => parseDMY(r.posted_date)));
    return latest(b) - latest(a);
  });
  return cycles;
}
// The exam cycle with the most recent activity -- "the exam that's
// current right now". Once a newer cycle starts, an older cycle's stuff
// (its portion sheet included) is done being "upcoming".
function latestExamCycle() {
  return sortedExamCycles()[0] || null;
}

// Shared "history line" timeline: items (already sorted into the order
// they should render in) get grouped under one date header per distinct
// ISO date, with a "Today" tag when that date is today. Feed, HW and
// Upcoming all read as a per-day list and share this same look; Exam and
// Notes don't (subject/cycle cards, not a flat dated list), so they build
// their own markup instead.
function timelineHtml(items, dateIso, rowHtml) {
  const today = todayISO();
  let html = "";
  let lastIso = null;
  items.forEach((item, i) => {
    const iso = dateIso(item);
    if (iso !== lastIso) {
      const isToday = iso === today;
      html += `<div class="feed-day-head${isToday ? " is-today" : ""}">${fmtDate(parseISO(iso))}${isToday ? '<span class="today-tag">Today</span>' : ""}</div>`;
      lastIso = iso;
    }
    html += rowHtml(item, i);
  });
  return html;
}

// A compact 7-day lookahead built from the yearly master lists, separate
// from the full action-card list below -- the master lists cover the
// whole academic year (22 holidays, 27 events, 8 PTMs), and turning every
// one of those into its own Upcoming card would bury the things that
// actually need a decision or a book to pack. This only ever shows what's
// happening in the next week, as a few compact rows.
function renderWeekStrip() {
  const el = document.getElementById("weekStrip");
  if (!el) return;

  // A holiday/event that already has its own real notice shows as a full
  // card lower on this same tab (via UPCOMING_CATEGORIES) -- skip it here
  // so it doesn't also show as a duplicate row in the strip.
  const alreadyShown = new Set(
    ALL.filter(r => ["Holiday", "School Event"].includes(r.category)).map(r => r.event_date_iso)
  );

  const items = [
    ...HOLIDAYS.holidays.map(h => ({ date_iso: h.date_iso, name: h.name, dot: "var(--dot-holiday)" })),
    ...EVENTS_CALENDAR.events.map(e => ({ date_iso: e.date_iso, name: e.name, dot: "var(--dot-event)" })),
    ...EVENTS_CALENDAR.ptm.map(p => ({
      date_iso: p.date_iso, dot: "var(--dot-event)",
      name: p.scope ? `${p.label} — ${p.scope}` : p.label,
    })),
  ]
    .filter(x => !alreadyShown.has(x.date_iso))
    .map(x => ({ ...x, _days: daysUntil(parseISO(x.date_iso)) }))
    .filter(x => x._days >= 0 && x._days <= 7)
    .sort((a, b) => a._days - b._days);

  if (items.length === 0) {
    el.innerHTML = "";
    return;
  }

  el.innerHTML = `<div class="week-strip-head">This week</div>` + items.map(x => `
    <div class="week-row${x._days === 0 ? " is-today" : ""}">
      <span class="week-dot" style="background:${x.dot}"></span>
      <span class="week-when">${x._days === 0 ? "Today" : x._days === 1 ? "Tomorrow" : fmtDate(parseISO(x.date_iso))}</span>
      <span class="week-name">${escapeHtml(x.name)}</span>
    </div>`).join("");
}

function renderUpcoming() {
  const list = document.getElementById("actionList");
  const currentCycle = latestExamCycle();

  // The portion sheet itself is one notification, not an event on any one
  // day -- Upcoming should show the individual exam day it actually
  // announces instead. Synthesize one entry per portion-table row for the
  // current cycle, skipping only a row whose subject *and* date already
  // match a real class-test notice (once the school posts the actual
  // September notice, it takes over rather than showing twice) -- matching
  // on subject alone would also catch that subject's regular class tests
  // earlier in the same cycle window, which are a different, smaller test.
  const portionData = PORTION_SCHEDULES[currentCycle];
  const portionNotice = ALL.find(r => r.category === "Exam/Test" && r.material_type === "Portion" && r.exam_cycle === currentCycle);
  const realExamSlots = new Set(
    ALL.filter(r => r.category === "Exam/Test" && r.material_type !== "Portion" && r.exam_cycle === currentCycle && r.subject)
      .map(r => `${r.subject}|${r.event_date_iso}`)
  );
  const synthetic = portionData?.schedule && portionNotice
    ? portionData.schedule
        .filter(row => !realExamSlots.has(`${row.subject}|${row.date_iso}`))
        .map(row => ({
          id: `portion-${currentCycle}-${row.subject}`.replace(/\s+/g, "-"),
          category: "Exam/Test",
          material_type: null,
          isSynthetic: true,
          subject: row.subject,
          exam_cycle: currentCycle,
          event_date_iso: row.date_iso,
          posted_date_iso: portionNotice.posted_date_iso,
          posted_date: portionNotice.posted_date,
          text: row.portion,
          // Not portionNotice.attachment_url: that's the whole cycle's
          // scanned portion sheet (every subject), not anything specific
          // to this one subject's exam day -- showing "View attachment"
          // here would point Maths, Science, Hindi... all at the exact
          // same PDF, which reads as broken rather than helpful. It's
          // already one tap away via the Exam tab's own "View portion" link.
          attachment_url: null,
        }))
    : [];

  const items = ALL
    .filter(r => UPCOMING_CATEGORIES.includes(r.category) && r.material_type !== "Portion")
    .concat(synthetic)
    .map(r => ({ ...r, _days: daysUntil(parseISO(r.event_date_iso)) }))
    .filter(r => r._days >= -5)
    .sort((a, b) => b._days - a._days);

  if (items.length === 0) {
    list.innerHTML = '<div class="empty-state">Nothing upcoming right now.</div>';
    return;
  }

  list.innerHTML = timelineHtml(items, r => r.event_date_iso, r => {
    const state = r._days < 0 ? "past" : r._days === 0 ? "today" : r._days <= 3 ? "soon" : "";
    const badge = r._days < 0
      ? `<span class="action-badge badge-past">${Math.abs(r._days)}d ago</span>`
      : r._days === 0
        ? `<span class="action-badge badge-today">Today</span>`
        : `<span class="action-badge badge-soon">In ${r._days}d</span>`;
    const attach = attachmentHtml(r.attachment_url, "action-attach-image", "action-attach", "View attachment →");
    // The day header above already shows the event date -- only the
    // "notified on a different day" qualifier is still worth a line here.
    const postedNote = r.event_date_iso !== r.posted_date_iso
      ? `<div class="action-date">notified ${fmtDate(parseDMY(r.posted_date))}</div>`
      : "";
    const kind = CATEGORY_META[r.category].label;
    // A real "class test" notice isn't itself the formal Half Yearly/PT-1
    // exam -- exam_cycle is just an internal grouping heuristic (nearest
    // named-cycle anchor in time) used to pull in the right prep material,
    // not something that should read as "this test IS that exam". Only the
    // portion-table-derived entries genuinely are that exam.
    const cycle = r.isSynthetic && r.exam_cycle ? ` · ${escapeHtml(r.exam_cycle)}` : "";
    // A per-subject class test (real or synthesized from the portion
    // table) gets its prep material pulled in too -- same subject, same
    // exam cycle -- so there's no need to jump to the Exam tab just to see
    // what to study for a test sitting right here in Upcoming. A single
    // class test only covers one chapter, though: Worksheet/Revision
    // notices never name a chapter at all (just a number, e.g. "Worksheet
    // No. 3"), so there's no way to tell whether one actually matches the
    // chapter under test -- a Chapter 3 test showing a Chapter 5 worksheet
    // is worse than showing nothing, so those are dropped entirely rather
    // than shown unfiltered. Only Notes (which do carry a chapter) get
    // included, and only when it matches. Portion-table entries have no
    // single chapter of their own -- those still show everything.
    const relatedMaterials = r.subject && r.exam_cycle
      ? ALL.filter(m => m.category === "Subject Notes" && m.subject === r.subject && m.exam_cycle === r.exam_cycle &&
          (!r.chapter || (m.material_type === "Notes" && m.chapter === r.chapter)))
        .sort((a, b) => parseDMY(b.posted_date) - parseDMY(a.posted_date))
      : [];
    const materialsHtml = relatedMaterials.length
      ? `<div class="action-materials">
           <div class="action-materials-head">Notes &amp; worksheets — ${escapeHtml(r.subject)}</div>
           ${relatedMaterials.map(r => examMaterialRowHtml(r)).join("")}
         </div>`
      : "";
    return `
      <div class="action-card state-${state}" id="upcoming-${r.id}">
        <div class="action-top" onclick="document.getElementById('upcoming-${r.id}').classList.toggle('open')">
          <div>
            <div class="action-kind">${kind}${cycle}</div>
            <div class="action-title">${escapeHtml(noticeTitle(r))}</div>
          </div>
          <div class="action-top-right">
            ${badge}
            <span class="action-chevron">▸</span>
          </div>
        </div>
        ${postedNote}
        <div class="action-full">${escapeHtml(r.text)}</div>
        ${materialsHtml}
        ${attach}
      </div>`;
  });
}

function noticeSubjects(r) {
  const subjects = new Set();
  if (r.subject) subjects.add(r.subject);
  (r.periods || []).forEach(p => { if (p.subject) subjects.add(p.subject); });
  return subjects;
}

function renderPeriods(periods) {
  const rows = periods.map(p => {
    const subject = p.subject ? subjectBadge(p.subject) : "";
    const note = p.note ? escapeHtml(p.note) : "";
    const hw = p.hw ? `<div class="period-hw"><span class="period-hw-tag">HW</span>${escapeHtml(p.hw)}</div>` : "";
    return `<div class="period-row"><span class="period-num">P${p.period}</span><div class="period-body">${subject}${note}${hw}</div></div>`;
  }).join("");
  return `<div class="period-list">${rows}</div>`;
}

function renderFeed(activeCategory, activeSubject) {
  activeCategory = activeCategory || "All";
  activeSubject = activeSubject || "All";

  const catChips = document.getElementById("categoryChips");
  const cats = ["All", ...FEED_CATEGORIES];
  catChips.innerHTML = cats.map(c =>
    `<button class="chip${c === activeCategory ? " active" : ""}" data-cat="${c}">${c === "All" ? "All" : CATEGORY_META[c].label}</button>`
  ).join("");
  catChips.querySelectorAll(".chip").forEach(btn => btn.onclick = () => renderFeed(btn.dataset.cat, activeSubject));

  const feedItems = ALL.filter(r => FEED_CATEGORIES.includes(r.category));
  let filtered = activeCategory === "All" ? feedItems : feedItems.filter(r => r.category === activeCategory);

  // Only the exam-track subjects (SUBJECT_META) are worth filtering by --
  // co-curricular subjects would clutter the row, and categories like
  // Holiday/School Event/General never carry a subject at all, so the row
  // just disappears for those instead of showing an unusable "All" alone.
  const allSubjects = new Set();
  filtered.forEach(r => noticeSubjects(r).forEach(s => { if (SUBJECT_META[s]) allSubjects.add(s); }));
  const subjChips = document.getElementById("subjectChips");
  if (allSubjects.size === 0) {
    subjChips.innerHTML = "";
    subjChips.style.display = "none";
    activeSubject = "All";
  } else {
    subjChips.style.display = "";
    const subjects = [...allSubjects].sort();
    const allBtn = `<button class="chip${activeSubject === "All" ? " active" : ""}" data-subj="All">All</button>`;
    subjChips.innerHTML = allBtn + subjects.map(s => subjectChipHtml(s, s === activeSubject, "chip")).join("");
    subjChips.querySelectorAll(".chip").forEach(btn => btn.onclick = () => renderFeed(activeCategory, btn.dataset.subj));
  }

  if (activeSubject !== "All") filtered = filtered.filter(r => noticeSubjects(r).has(activeSubject));

  const list = document.getElementById("feedList");
  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-state">No notices match this filter.</div>';
    return;
  }

  const today = todayISO();
  list.innerHTML = timelineHtml(filtered, r => r.posted_date_iso, (r, i) => {
    const meta = CATEGORY_META[r.category];
    const preview = noticeTitle(r);
    const attach = attachmentHtml(r.attachment_url, "feed-attach-image", "feed-attach", "View attachment →");
    const body = (r.periods && r.periods.length)
      ? renderPeriods(r.periods)
      : escapeHtml(r.text);
    const isTodayTimetable = r.is_timetable && r.event_date_iso === today;
    return `
      <div class="feed-item${isTodayTimetable ? " is-today-timetable" : ""}" id="feed-${i}">
        <div class="feed-item-row" onclick="document.getElementById('feed-${i}').classList.toggle('open')">
          <span class="feed-dot" style="background:${meta.dot}"></span>
          <span class="feed-preview">${escapeHtml(preview)}</span>
          <span class="feed-chevron">▸</span>
        </div>
        <div class="feed-full">${body}${attach}</div>
      </div>`;
  });
}

// Every material row is one click target, straight to the one attachment
// that's actually useful next -- no icon, no picking between links. A
// Worksheet opens its paired Answer Key once one exists (checking your
// answers is the next step once the worksheet's done), falling back to
// the worksheet itself before that; Notes/Revision/a lone Answer Key each
// only ever have their own single attachment anyway.
function materialHref(r) {
  if (r.material_type === "Worksheet") return r.answer_key_url || r.attachment_url || null;
  return r.attachment_url || null;
}

const MATERIAL_TAG_META = {
  "Worksheet": { cls: "tag-worksheet", label: "Worksheet" },
  "Revision": { cls: "tag-revision", label: "Revision" },
  "Answer Key": { cls: "tag-answerkey", label: "Answer Key" },
};
// The raw notice text is verbose boilerplate ("PFA the Culmination
// Worksheet No. 3 for English") when all that's actually new information
// is the number -- the subject is already the card/section it's filed
// under. Use the already-extracted worksheet_number for a plain "Worksheet
// No. 3" / "Revision No. 8" instead, falling back to the raw text only
// when no number was extracted (a Worksheet/Revision notice that doesn't
// state one, or one covering several at once like "Revision-1,2,3,4").
// showTag=false when the row already sits inside a card grouped by its
// own material type (Notes tab) -- the card's own heading already says
// "Worksheets", so repeating a WORKSHEET tag on every row under it is
// redundant. The Exam tab's subject cards mix all types together, so
// those still need the per-row tag to tell them apart.
function examMaterialRowHtml(r, showTag = true) {
  const { cls: tagClass, label: tagLabel } = MATERIAL_TAG_META[r.material_type] || { cls: "tag-notes", label: "Notes" };
  const title = r.chapter
    || ((r.material_type === "Worksheet" || r.material_type === "Revision") && r.worksheet_number != null
      ? `${tagLabel} No. ${r.worksheet_number}`
      : firstLine(r.text));
  const href = materialHref(r);
  const inner = `
      <div class="exam-material-body">
        <div class="exam-material-top">
          ${showTag ? `<span class="exam-material-tag ${tagClass}">${tagLabel}</span>` : ""}
          <span class="exam-material-title">${escapeHtml(title)}</span>
        </div>
        <div class="exam-material-meta">
          <span class="exam-material-date">Posted ${fmtDate(parseDMY(r.posted_date))}</span>
        </div>
      </div>`;
  return href
    ? `<a class="exam-material-row exam-material-row-link" href="${href}" target="_blank" rel="noopener">${inner}</a>`
    : `<div class="exam-material-row">${inner}</div>`;
}

// One card per subject: its portion-table slot (date/marks/topic), when
// there is one, plus every note/worksheet/revision tagged to this cycle.
function examSubjectCardHtml(subject, items, scheduleRow) {
  const subjItems = [...items].sort((a, b) => parseDMY(b.posted_date) - parseDMY(a.posted_date));
  const headRight = scheduleRow
    ? `<span class="exam-subject-head-right">
         <span class="portion-schedule-date">${fmtDate(parseISO(scheduleRow.date_iso))}</span>
         ${scheduleRow.marks ? `<span class="exam-schedule-marks">${scheduleRow.marks} marks</span>` : ""}
       </span>`
    : `<span class="material-count">${subjItems.length}</span>`;
  const portionText = scheduleRow ? `<div class="portion-row-text">${escapeHtml(scheduleRow.portion)}</div>` : "";
  return `
    <div class="material-group-card">
      <div class="exam-subject-head">${subjectBadge(subject)}<span>${escapeHtml(subject)}</span>${headRight}</div>
      ${portionText}
      ${subjItems.map(r => examMaterialRowHtml(r)).join("")}
    </div>`;
}

function renderNotes(activeSubject) {
  const subjects = [...new Set(ALL.filter(r => r.category === "Subject Notes" && r.subject).map(r => r.subject))].sort();
  const grid = document.getElementById("subjectGrid");
  grid.innerHTML = subjects.map(s => subjectChipHtml(s, s === activeSubject, "subject-chip")).join("");
  grid.querySelectorAll(".subject-chip").forEach(btn => btn.onclick = () => renderNotes(btn.dataset.subj));

  const list = document.getElementById("chapterList");
  if (!activeSubject) {
    list.innerHTML = '<div class="empty-state">Pick a subject above to browse its notes.</div>';
    return;
  }
  // A paired Answer Key's link already rides along on its Worksheet's row
  // (materialHref()), so it doesn't get a row of its own here.
  const items = ALL.filter(r =>
    r.category === "Subject Notes" && r.subject === activeSubject &&
    !(r.material_type === "Answer Key" && r.paired)
  );

  if (items.length === 0) {
    list.innerHTML = '<div class="empty-state">Nothing here yet.</div>';
    return;
  }

  // Exam cycle is the outer grouping -- which exam you're prepping for is
  // the first thing you filter by -- material type nested inside each cycle
  // (revision numbering resets per exam, so PT-1's "Revision 1" and Half
  // Yearly's aren't the same thing, and need their own card to stay clear).
  const cycles = [...new Set(items.map(r => r.exam_cycle || "Other"))];
  cycles.sort((a, b) => {
    const latest = c => Math.max(...items.filter(r => (r.exam_cycle || "Other") === c).map(r => parseDMY(r.posted_date)));
    return latest(b) - latest(a);
  });

  const MATERIAL_GROUPS = [
    { type: "Notes", label: "Notes" },
    { type: "Worksheet", label: "Worksheets" },
    { type: "Revision", label: "Revision" },
    { type: "Answer Key", label: "Answer Key" },
  ];

  list.innerHTML = cycles.map(cycle => {
    const cycleItems = items
      .filter(r => (r.exam_cycle || "Other") === cycle)
      .sort((a, b) => parseDMY(b.posted_date) - parseDMY(a.posted_date));
    const typesHtml = MATERIAL_GROUPS.map(({ type, label }) => {
      const typeItems = cycleItems.filter(r => r.material_type === type);
      if (typeItems.length === 0) return "";
      return `
        <div class="material-type-head">${label}<span class="material-count">${typeItems.length}</span></div>
        ${typeItems.map(r => examMaterialRowHtml(r, false)).join("")}`;
    }).join("");
    return `
      <div class="cycle-head">${escapeHtml(cycle)}</div>
      <div class="material-group-card">${typesHtml}</div>`;
  }).join("");
}

function renderExam(activeCycle) {
  const cycles = sortedExamCycles();
  // Default to the most recently active cycle -- almost always "the exam
  // that's coming up" -- so prep material shows up with zero clicks.
  if (!activeCycle || !cycles.includes(activeCycle)) activeCycle = cycles[0] || null;

  const grid = document.getElementById("examCycleGrid");
  grid.innerHTML = cycles.map(c =>
    `<button class="subject-chip${c === activeCycle ? " active" : ""}" data-cycle="${escapeHtml(c)}">${escapeHtml(c)}</button>`
  ).join("");
  grid.querySelectorAll(".subject-chip").forEach(btn => btn.onclick = () => renderExam(btn.dataset.cycle));

  const detail = document.getElementById("examDetail");
  if (!activeCycle) {
    detail.innerHTML = '<div class="empty-state">No exam cycles found yet.</div>';
    return;
  }

  const items = ALL.filter(r => r.exam_cycle === activeCycle);
  const portion = items.find(r => r.category === "Exam/Test" && r.material_type === "Portion");
  const portionData = PORTION_SCHEDULES[activeCycle];
  const materials = items.filter(r => r.category === "Subject Notes" && r.subject);

  let html = "";

  if (portion) {
    const meta = [];
    if (portionData?.timing) meta.push(`Timing: ${escapeHtml(portionData.timing)}`);
    if (portionData?.max_marks) meta.push(`Max marks: ${portionData.max_marks}`);
    html += `
      <div class="exam-portion-card">
        <div class="exam-portion-label">Exam Portion</div>
        <div class="exam-portion-title">${escapeHtml(firstLine(portion.text))}</div>
        ${meta.length ? `<div class="exam-portion-meta">${meta.join(" · ")}</div>` : ""}
        ${portion.attachment_url ? `<a class="exam-portion-link" href="${portion.attachment_url}" target="_blank" rel="noopener">View portion →</a>` : ""}
      </div>`;
  }

  const bySubject = new Map();
  materials.forEach(r => {
    if (!bySubject.has(r.subject)) bySubject.set(r.subject, []);
    bySubject.get(r.subject).push(r);
  });

  if (!portion && !portionData?.schedule?.length && bySubject.size === 0) {
    html += '<div class="empty-state">Nothing tagged to this exam yet.</div>';
  }

  if (portionData?.schedule?.length) {
    // One card per subject holds its portion-table slot (date/marks/topic)
    // *and* its prep material together -- the date and topic aren't split
    // into a separate schedule list from the notes/worksheets/revision.
    const scheduleSubjects = new Set(portionData.schedule.map(row => row.subject));
    const holidays = ALL.filter(r => r.category === "Holiday");

    portionData.schedule.forEach((row, i) => {
      html += examSubjectCardHtml(row.subject, bySubject.get(row.subject) || [], row);

      const next = portionData.schedule[i + 1];
      if (next) {
        const gapDays = Math.round((parseISO(next.date_iso) - parseISO(row.date_iso)) / 86400000) - 1;
        if (gapDays >= 2) {
          const holiday = holidays.find(h => h.event_date_iso > row.date_iso && h.event_date_iso < next.date_iso);
          const label = holiday ? `Holiday — ${escapeHtml(firstLine(holiday.text))}` : `${gapDays}-day gap`;
          html += `<div class="exam-gap-row">${label} · buffer time before the next test</div>`;
        }
      }
    });

    if (portionData.notes?.length) {
      html += `<div class="portion-notes"><ul>${portionData.notes.map(n => `<li>${escapeHtml(n)}</li>`).join("")}</ul></div>`;
    }

    // A subject with prep material but no slot in the portion table (rare)
    // still gets a card so nothing's lost.
    [...bySubject.keys()].filter(s => !scheduleSubjects.has(s)).sort().forEach(subject => {
      html += examSubjectCardHtml(subject, bySubject.get(subject));
    });
  } else {
    // No transcribed portion table for this cycle -- plain material cards.
    [...bySubject.keys()].sort().forEach(subject => {
      html += examSubjectCardHtml(subject, bySubject.get(subject));
    });
  }

  detail.innerHTML = html;
}

const HW_COMPLETED_KEY = "hwCompleted_v1";
const HW_SEEDED_KEY = "hwSeeded_v1";
const HW_WINDOW_DAYS = 14; // how far back the HW tab looks
const HW_SEED_DAYS = 7;    // backlog older than this is auto-marked done on first-ever load

function collectHwTasks() {
  const tasks = [];
  ALL.forEach(r => {
    if (r.category !== "Daily Class Update" || !r.periods) return;
    r.periods.forEach(p => {
      if (!p.hw) return;
      tasks.push({
        id: `${r.id}-p${p.period}`,
        subject: p.subject,
        text: p.hw,
        date_iso: r.posted_date_iso,
        posted_date: r.posted_date,
      });
    });
  });
  return tasks;
}

function loadHwCompleted() {
  try { return new Set(JSON.parse(localStorage.getItem(HW_COMPLETED_KEY) || "[]")); }
  catch { return new Set(); }
}
function saveHwCompleted(set) {
  try { localStorage.setItem(HW_COMPLETED_KEY, JSON.stringify([...set])); } catch {}
}

// First-ever load has no real completion history, and the scraped data
// can span months -- without this, every HW ever posted would show up as
// undone backlog. Auto-mark anything older than a week done so only
// recent, actually-actionable homework needs a look. Runs once: after
// that, only the user's own taps change what's marked done.
function seedHwCompletedIfNeeded(tasks) {
  try {
    if (localStorage.getItem(HW_SEEDED_KEY)) return loadHwCompleted();
  } catch {
    return new Set();
  }
  const done = new Set();
  tasks.forEach(t => {
    if (-daysUntil(parseISO(t.date_iso)) > HW_SEED_DAYS) done.add(t.id);
  });
  saveHwCompleted(done);
  try { localStorage.setItem(HW_SEEDED_KEY, "1"); } catch {}
  return done;
}

const HW_CHECK_ICONS = {
  done: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" fill="currentColor" opacity="0.15"/><circle cx="12" cy="12" r="9"/><path d="M8 12.3l2.5 2.5L16 9"/></svg>',
  todo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>',
};

function hwRowHtml(t, done) {
  return `
    <div class="hw-row${done ? " is-done" : ""}" id="hw-${t.id}" onclick="toggleHwDone('${t.id}')">
      <span class="hw-check">${done ? HW_CHECK_ICONS.done : HW_CHECK_ICONS.todo}</span>
      <div class="hw-body">
        ${t.subject ? `<div class="hw-top">${subjectBadge(t.subject)}</div>` : ""}
        <div class="hw-text">${escapeHtml(t.text)}</div>
      </div>
    </div>`;
}

function renderHw() {
  const list = document.getElementById("hwList");
  const tasks = collectHwTasks();
  const completed = seedHwCompletedIfNeeded(tasks);

  const visible = tasks
    .filter(t => -daysUntil(parseISO(t.date_iso)) <= HW_WINDOW_DAYS)
    .sort((a, b) => parseDMY(b.posted_date) - parseDMY(a.posted_date));

  if (visible.length === 0) {
    list.innerHTML = '<div class="empty-state">No homework from the last two weeks.</div>';
    return;
  }

  const rows = timelineHtml(visible, t => t.date_iso, t => hwRowHtml(t, completed.has(t.id)));
  list.innerHTML = `<div class="hw-list">${rows}</div>`;
}

function toggleHwDone(id) {
  const completed = loadHwCompleted();
  if (completed.has(id)) completed.delete(id); else completed.add(id);
  saveHwCompleted(completed);
  const row = document.getElementById(`hw-${id}`);
  if (!row) return;
  const nowDone = completed.has(id);
  row.classList.toggle("is-done", nowDone);
  row.querySelector(".hw-check").innerHTML = nowDone ? HW_CHECK_ICONS.done : HW_CHECK_ICONS.todo;
}

document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
  };
});

Promise.all([
  fetch("notices.json?_=" + Date.now()).then(r => r.json()),
  fetch("portion_schedules.json?_=" + Date.now()).then(r => r.ok ? r.json() : {}).catch(() => ({})),
  fetch("holidays.json?_=" + Date.now()).then(r => r.ok ? r.json() : {}).catch(() => ({})),
  fetch("events_calendar.json?_=" + Date.now()).then(r => r.ok ? r.json() : {}).catch(() => ({})),
  fetch("last_updated.json?_=" + Date.now()).then(r => r.ok ? r.json() : null).catch(() => null),
])
  .then(([data, portionSchedules, holidays, eventsCalendar, lastUpdated]) => {
    ALL = data.sort((a, b) => parseDMY(b.posted_date) - parseDMY(a.posted_date));
    PORTION_SCHEDULES = portionSchedules;
    HOLIDAYS = { holidays: [], vacations: [], ...holidays };
    EVENTS_CALENDAR = { events: [], ptm: [], exam_windows: [], ...eventsCalendar };
    renderWeekStrip();
    renderUpcoming();
    renderFeed("All");
    renderNotes("English");
    renderExam(null);
    renderHw();
    // The pipeline's own fetch timestamp -- when the data actually last
    // changed, not just when this page happens to be viewed. Falls back to
    // "today" only if last_updated.json hasn't been generated yet.
    const updatedText = lastUpdated?.last_updated
      ? new Date(lastUpdated.last_updated).toLocaleString("en-IN", {
          day: "numeric", month: "short", year: "numeric", hour: "numeric", minute: "2-digit",
          timeZone: "Asia/Kolkata",
        })
      : new Date().toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
    document.getElementById("footerNote").textContent = `${ALL.length} notices · updated ${updatedText}`;
  })
  .catch(err => {
    document.getElementById("footerNote").textContent = "Failed to load notices.json — " + err.message;
  });
</script>
