name: Scrape notices

on:
  schedule:
    # 09:30 UTC = 3:00pm IST, 11:30 UTC = 5:00pm IST.
    - cron: "30 9 * * *"
    - cron: "30 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python main.py
        env:
          ERP_BASE_URL: ${{ secrets.ERP_BASE_URL }}
          ERP_USERNAME: ${{ secrets.ERP_USERNAME }}
          ERP_PASSWORD: ${{ secrets.ERP_PASSWORD }}

      - name: Commit and push updated notices
        run: |
          git add docs/notices.json docs/last_updated.json docs/holidays.json docs/events_calendar.json docs/timetable.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet -- docs/notices.json; then
            git commit -m "Update last-fetched timestamp [automated]"
          else
            git commit -m "Update notices [automated]"
          fi
          git push
