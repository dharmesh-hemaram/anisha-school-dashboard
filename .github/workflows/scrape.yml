name: Scrape & deploy

on:
  schedule:
    # 09:30 UTC = 3:00pm IST, 11:30 UTC = 5:00pm IST.
    - cron: "30 9 * * *"
    - cron: "30 11 * * *"
  push:
    branches: [main]
    paths: ["web/**"]
  workflow_dispatch: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape:
    # A frontend-only push doesn't need a fresh scrape -- the deploy job
    # below still runs (via its `if: always() && ...`) and just reuses
    # whatever docs/*.json is already on disk.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python main.py
        env:
          ERP_BASE_URL: ${{ secrets.ERP_BASE_URL }}
          ERP_USERNAME: ${{ secrets.ERP_USERNAME }}
          ERP_PASSWORD: ${{ secrets.ERP_PASSWORD }}
          # Calendar sync is optional -- main.py skips it cleanly if this
          # secret isn't set. GOOGLE_CALENDAR_ID isn't sensitive (it's
          # already public in the app's "Subscribe on Calendar" link, see
          # web/src/routes/AppLayout.tsx), so it's hardcoded here rather
          # than as another secret.
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CALENDAR_ID: c037f4d74892f557ed740b1d2410e6bb1efcab224ddd95ad45d1e486bc8a85e5@group.calendar.google.com

      - name: Commit and push updated notices
        run: |
          git add docs/notices.json docs/last_updated.json docs/holidays.json docs/events_calendar.json docs/timetable.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet -- docs/notices.json; then
            git commit -m "Update last-fetched timestamp [automated]"
          else
            git commit -m "Update notices [automated]"
          fi
          git push

      # Handed to the deploy job as a build artifact rather than left for it
      # to re-checkout: actions/checkout in a later job of the same run
      # still resolves to the commit that triggered the workflow, not the
      # one just pushed above, so a second checkout would silently deploy
      # stale data. Uploaded even on the "nothing changed" no-op path, since
      # the deploy job runs regardless and needs *some* copy of the data.
      - uses: actions/upload-artifact@v4
        with:
          name: docs-data
          path: |
            docs/notices.json
            docs/portion_schedules.json
            docs/holidays.json
            docs/events_calendar.json
            docs/last_updated.json
            docs/timetable.json
            docs/revision-notebooks/*.json

  deploy:
    needs: [scrape]
    if: always() && (needs.scrape.result == 'success' || needs.scrape.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Only exists when `scrape` actually ran (schedule/workflow_dispatch)
      # -- a frontend-only push skips `scrape` entirely, so there's nothing
      # to download and this job's own checkout above already has current
      # docs/*.json (nothing skipped touches it).
      - name: Download scraped data artifact
        if: needs.scrape.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: docs-data
          path: docs-data

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run build
        working-directory: web

      # Runtime-fetched, not bundled: notices.json only grows, and bundling
      # it would bust the JS/CSS cache hash on every scrape run. See
      # web/src/features/data/dataSlice.ts and
      # web/src/features/revision/revisionSlice.ts (same pattern -- a new
      # subject's revision notebook is just a JSON file here, no code or
      # workflow change needed).
      - name: Copy scraped data + add SPA fallback into the build output
        run: |
          mkdir -p web/dist/data
          if [ -d docs-data ]; then
            cp -r docs-data/. web/dist/data/
          else
            cp docs/*.json web/dist/data/
            mkdir -p web/dist/data/revision-notebooks
            cp docs/revision-notebooks/*.json web/dist/data/revision-notebooks/
          fi
          # GitHub Pages has no server-side rewrite -- a hard refresh or
          # shared link on a client-side route (e.g. /exam/Half-Yearly)
          # would otherwise 404. Copying index.html to 404.html makes
          # Pages serve the app shell for any unmatched path; React Router
          # then renders the right route from the URL client-side.
          cp web/dist/index.html web/dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - id: deployment
        uses: actions/deploy-pages@v4
