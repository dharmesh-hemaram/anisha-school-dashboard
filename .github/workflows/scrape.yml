name: Scrape notices

on:
  schedule:
    # 15:00 UTC = 8:30pm IST -- after the school day's notices are posted.
    - cron: "0 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python main.py
        env:
          ERP_BASE_URL: ${{ secrets.ERP_BASE_URL }}
          ERP_USERNAME: ${{ secrets.ERP_USERNAME }}
          ERP_PASSWORD: ${{ secrets.ERP_PASSWORD }}

      - name: Commit and push updated notices
        run: |
          if git diff --quiet -- docs/notices.json; then
            echo "No new notices."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/notices.json
          git commit -m "Update notices [automated]"
          git push
